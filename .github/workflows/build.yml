name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Unzip and set Fabric API version
        run: |
          unzip -q stretchres.zip
          cd stretchres
          VER=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*+26\.2</version>' | tail -1 | sed 's/<[^>]*>//g')
          echo "Fabric API: $VER"
          test -n "$VER"
          sed -i "s|^fabric_version=.*|fabric_version=$VER|" gradle.properties

      - name: Build
        working-directory: stretchres
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: stretchres
          path: stretchres/build/libs/*.jar
